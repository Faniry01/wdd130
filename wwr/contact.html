<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting to learn more about our rafting trips, reservations, and services.">
    <meta  name="author" content="Rafiliposon Fanirisoa Andriamanjato">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting</title>
    
</head>
<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="contact-title">Contact Us | White Water Rafting</h1>
        <section class="contact-info">
            <p>Address: 123 River Road, Idaho Falls, ID 83401</p>
            <p>Phone: (208) 555-1234</p>
            <p>Email: info@whitewaterrafting.com</p>
        </section>
        <div class="contact-layout">
        <section class="contact-map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d92618.49778048055!2d-112.11855351580385!3d43.49549149840033!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5354594e739512b5%3A0x2311c9fc094c49c9!2sIdaho%20Falls%2C%20Idaho%2C%20%C3%89tats-Unis!5e0!3m2!1sfr!2smg!4v1790937172837!5m2!1sfr!2smg" 
            width="600" 
            height="450" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </section>
        
            <section class="contact-form">
                <form>
                        <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>

                        <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Message Purpose:</legend>

                        <div class="purpose-options">
                         <label>
                             <input type="radio" id="general" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                        </div>
                    </fieldset>

                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>

                        <label>
                            <input type="checkbox" id="newsletter" name="newsletter">
                            Please subscribe me to the monthly newsletter
                        </label>

                        <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="team">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/river-guide.jpg" alt="River guide on a rafting trip">
                <figcaption>River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/adventure-coordinator.jpg" alt="Outdoor adventure person">
                <figcaption>Adventure Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/outdoor-specialist.jpg" alt="Outdoor adventure specialist">
                <figcaption>Outdoor Specialist</figcaption>
            </figure>
        </section>
        
    </main>
    
    <footer>
        <p>© 2026 White Water Rafting | Rafiliposon Fanirisoa Andriamanjato</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
            <img src="images/facebook.png" alt="facebook Icon">
             </a>

             <a href="https://www.linkedin.com">
            <img src="images/linkedin.png" alt="linkedin Icon">      
             </a>

             <a href="https://instagram.com">
                <img src="images/instagram.png" alt="instagram Icon">
             </a>
        </nav>

    </footer>

</body>
</html>
